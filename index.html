<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishongororo Shop - IBANDA</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#ff6600;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:15px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-align:center;padding-bottom:10px}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.card h3{margin:8px 5px 2px 5px;font-size:14px;height:35px;overflow:hidden}
.price{color:#ff6600;font-weight:bold;margin:5px}
.btn{display:inline-block;background:#25D366;color:white;padding:6px 12px;border-radius:5px;text-decoration:none;margin:3px;font-size:13px}
</style>
</head>
<body>
<div class="header" style="display:flex; align-items:center; gap:15px; padding:12px 15px; background:#cc0000; color:white; flex-wrap:wrap;">
<img src="/images/owner.jpeg" style="width:75px; height:75px; border-radius:50%; border:3px solid white; object-fit:cover; background:white; flex-shrink:0;" onerror="this.src='/images/Owner.jpeg'; this.onerror=null;">
<div style="line-height:1.3;">
<h2 style="margin:0; font-size:17px;">Ishongororo Household Shop - IBANDA</h2>
<p style="margin:4px 0 0 0; font-size:14px; font-weight:bold;">CEO: AMBROSE 62</p>
<p style="margin:2px 0 0 0; font-size:13px;">📞 0785067445 | 0770348105</p>
<p id="count" style="margin:3px 0 0 0; font-size:11px; opacity:0.9;">Showing 24 products</p>
</div>
</div>
<div class="grid" id="products"></div>

<script>
async function load(){
  try{
    const res = await fetch('/api/products');
    const products = await res.json();
    document.getElementById('count').innerText = `Showing ${products.length} products with pictures`;
    const grid = document.getElementById('products');
    grid.innerHTML = products.map(p => `
      <div class="card">
        <img src="${p.image}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'" alt="${p.name}">
        <h3>${p.name}</h3>
        <div class="price">UGX ${p.price.toLocaleString()}</div>
        <div style="font-size:11px;color:gray">${p.category} | Stock: ${p.stock_qty}</div>
        <a class="btn" href="https://wa.me/256700000000?text=Hello, I want ${p.name}" target="_blank">WhatsApp</a>
        <a class="btn" style="background:#ff6600" href="tel:+256785067445">Call</a>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('count').innerText = 'Error loading products - check server.js running';
  }
}
load();
</script>
</body>
</html>
